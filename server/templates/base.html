<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>{% block title %}管理后台{% endblock %} · 代理审计</title>
<link rel="stylesheet" href="{{ url_for('static', filename='bootstrap.min.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-3">
  <div class="container-fluid">
    <a class="navbar-brand" href="{{ url_for('audit') }}">🛡 代理审计系统</a>
    {% if session_admin %}
    <ul class="navbar-nav me-auto">
      <li class="nav-item"><a class="nav-link" href="{{ url_for('audit') }}">审计查询</a></li>
      <li class="nav-item"><a class="nav-link" href="{{ url_for('users_page') }}">用户管理</a></li>
      <li class="nav-item"><a class="nav-link" href="{{ url_for('roles_page') }}">规则组</a></li>
    </ul>
    <span class="navbar-text text-light me-3">👤 {{ session_admin }}</span>
    <a class="btn btn-outline-light btn-sm" href="{{ url_for('logout') }}">退出</a>
    {% endif %}
  </div>
</nav>
<div class="container-fluid">
  {% with msgs = get_flashed_messages(with_categories=true) %}
    {% for cat, m in msgs %}
      <div class="alert alert-{{ cat }} alert-dismissible fade show">{{ m }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
    {% endfor %}
  {% endwith %}
  {% block body %}{% endblock %}
</div>
<script src="{{ url_for('static', filename='bootstrap.bundle.min.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
